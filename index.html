<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>specially for Gungun💖</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,500;0,700;0,800;1,500&family=Poppins:wght=400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BACKGROUND STARS & CANVAS SYSTEM -->
    <div class="stars"></div>
    <canvas id="effectCanvas"></canvas>
    <div id="rainContainer"></div>

    <!-- AUDIO FILES (Updated to .m4a as per repository) -->
    <audio id="countdownAudio" src="countdown2.m4a" preload="auto"></audio>
    <audio id="selfi1" src="selfi 1.mp3" preload="auto" loop></audio>
    <audio id="selfi3" src="selfi 3.m4a" preload="auto"></audio>

    <!-- MAIN INTERACTIVE CONTAINER -->
    <div class="container">

        <!-- STEP 1: GIFT BOX SECTION -->
        <div id="giftSection">
            <div id="mainLink" class="gift-link-wrapper">
                <img id="giftBox" class="gift-img" src="gift.png" alt="Special Gift for You">
                <p class="tap-text">Tap on the Gift Box to Open! ✨</p>
            </div>
        </div>

        <!-- STEP 2: COUNTDOWN TIMER SCREEN -->
        <div id="countdownScreen" class="hidden">
            <div id="countdownNumber">3</div>
        </div>

        <!-- STEP 3: PURE BLACK SCREEN FOR SUSPENSE, DIALOGUE & RAIN -->
        <div id="bdayGreetingScreen" class="hidden"></div>

        <!-- STEP 4: TEMPLATE TRANSITION IMAGE -->
        <div id="templateSection" class="hidden template-wrapper">
            <img class="template-img" src="birthday-template.png" alt="Birthday Special Memory">
        </div>

        <!-- STEP 5: NOTEBOOK LETTER BOX WITH SKETCH WATERMARK -->
        <div id="messageSection" class="hidden scroll-letter">
            <div id="typewriterText" class="letter-text"></div>
        </div>

    </div>

    <!-- Main Script Engine -->
    <script src="script.js"></script>
</body>
</html>
