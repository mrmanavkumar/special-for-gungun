<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Someone Special ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ✨ Dynamic Rain: Balloons, Sparkles & Hearts -->
    <div id="effects-container" class="effects-overlay"></div>

    <!-- 🎵 Audio Element -->
    <audio id="bgMusic" src="countdown.mp3" preload="auto"></audio>

    <!-- 🎈 Preloader -->
    <div class="balloon-loader" id="balloonLoader">
        <div class="loader-text">Loading something special for Gungun... 🌸</div>
    </div>

    <!-- 🎁 Main Content Container -->
    <main id="mainWishContainer" class="main-content-hidden">

        <!-- Countdown Number Overlay (3, 2, 1) -->
        <div id="countdownOverlay" class="countdown-overlay hidden">
            <span id="countdownNumber">3</span>
        </div>

        <!-- Happy Birthday Animated Text (Without Gungun Name) -->
        <div id="birthdayGreeting" class="birthday-text hidden">
            <h1>🎉 Happy Birthday! 🎈</h1>
        </div>

        <!-- 1. Interactive Gift Box Section -->
        <div id="giftBoxSection" class="gift-box-wrapper" onclick="startSurpriseSequence()">
            <div class="gift-image-container" id="giftBoxContainer">
                <img src="gift.png" alt="Special Gift Box" class="gift-img">
            </div>
            <div class="tap-instruction">
                <span>🎁 Tap Box to Open Surprise 🎁</span>
            </div>
        </div>

        <!-- 2. Birthday Template Section -->
        <div id="templateSection" class="media-container hidden">
            <div class="template-card">
                <img src="birthday-template.png" alt="Birthday Wish Template" class="wish-template-img">
            </div>
        </div>

        <!-- 3. Letter Box Section (With Watermark & Corner Decorations) -->
        <div id="messageSection" class="message-container hidden">
            <div class="letter-background">
                <!-- Corner Decorations -->
                <div class="corner-deco top-left">🌸🎈</div>
                <div class="corner-deco top-right">🎈🌸</div>
                <div class="corner-deco bottom-left">🌸✨</div>
                <div class="corner-deco bottom-right">✨🌸</div>

                <!-- Watermark Sketch -->
                <div class="sketch-watermark">
                    <img src="sketch.png" alt="Sketch Watermark">
                </div>

                <!-- Typewriter Letter Content -->
                <div id="typewriterText" class="letter-content"></div>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
