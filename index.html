<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Someone Special ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ✨ Dynamic Rain Balloons & Sparkles Background -->
    <div id="effects-container" class="effects-overlay"></div>

    <!-- 🎵 Audio Element with Repo Audio -->
    <audio id="bgMusic" src="countdown.mp3" preload="auto"></audio>

    <!-- 🎈 Pre-loader Screen -->
    <div class="balloon-loader" id="balloonLoader">
        <div class="loader-text">Loading something special for Gungun... 🌸</div>
    </div>

    <!-- 🎁 Main Wrapper -->
    <main id="mainWishContainer" class="main-content-hidden">

        <!-- 1. Counting Section -->
        <div id="countingSection" class="counter-badge">
            <span id="countdownText">Turning 23 🎂✨</span>
        </div>

        <!-- 2. Gift Box Section (Click to Open) -->
        <div id="giftBoxSection" class="gift-box-wrapper" onclick="openBox()">
            <div class="gift-image-container">
                <img src="gift.png" alt="Special Gift Box" class="gift-img">
            </div>
            <div class="tap-instruction">
                <span>🎁 Tap Box to Open Surprise 🎁</span>
            </div>
        </div>

        <!-- 3. Template & Sketch Display Section -->
        <div id="templateSection" class="media-container hidden">
            <div class="template-card">
                <img src="birthday-template.png" alt="Birthday Wish Template" class="wish-template-img">
                <img src="sketch.png" alt="Special Sketch" class="sketch-img">
            </div>
        </div>

        <!-- 4. Typewriter Letter Box Section -->
        <div id="messageSection" class="message-container hidden">
            <div class="letter-background">
                <div id="typewriterText" class="letter-content"></div>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
