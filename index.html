<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Birthday Wish</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- BACKGROUND EFFECTS -->
    <div class="stars"></div>
    <canvas id="effectCanvas"></canvas>
    <div id="rainContainer"></div>

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- STEP 1 & 2: LOADING & GIFT BOX -->
        <div id="giftSection">
            <button id="loadingBtn" class="loading-center">Loading...</button>

            <div id="giftWrapper" class="gift-fade-init hidden">
                <a id="giftLink" class="gift-link-wrapper" href="javascript:void(0)">
                    <img id="giftBoxImg" src="gift.png" alt="Gift Box" class="gift-img">
                    <p class="tap-text">Tap to open your surprise ✨</p>
                </a>
            </div>
        </div>

        <!-- STEP 3: COUNTDOWN -->
        <div id="countdownScreen" class="hidden">
            <h1 id="countdownNumber">3</h1>
        </div>

        <!-- STEP 4: GREETING SCREEN -->
        <div id="bdayGreetingScreen" class="hidden">
            <h1 class="bday-text fade-in-out">HAPPY BIRTHDAY</h1>
        </div>

        <!-- STEP 5: TEMPLATE TRANSITION IMAGE -->
        <div id="templateSection" class="hidden template-wrapper">
            <img class="template-img" src="birthday-template.png" alt="Birthday Template">
        </div>

        <!-- STEP 6: NOTEBOOK LETTER BOX -->
        <div id="messageSection" class="hidden scroll-letter">
            <div id="typewriterText" class="letter-text"></div>
        </div>

        <!-- STEP 7: TRANSITION MESSAGE SCREEN -->
        <div id="lastMsgScreen" class="hidden">
            <h2 class="last-msg-text">In my eyes, who you really are...<br>let me show you.</h2>
        </div>

        <!-- STEP 8: FINAL POSTER SCREEN -->
        <div id="posterSection" class="hidden poster-wrapper">
            <img class="poster-img" src="mg.png" alt="Gungun Poster">
        </div>

    </div>

    <!-- AUDIO ELEMENTS -->
    <audio id="bgMusic" src="bg-music.mp3" preload="auto" loop></audio>
    <audio id="devaMusic" src="deva-music.mp3" preload="auto"></audio>

    <!-- Main Logic Script Engine -->
    <script src="./script.js"></script>
</body>
</html>
