<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special for Gungun ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="tikTokAudio" src="tik tok.m4a"></audio>
    <audio id="bgMusic" src="bg-music.mp3" loop></audio>
    <audio id="hbAudio" src="HB.m4a"></audio>

    <!-- Canvas for Balloons & Sparkles Rain -->
    <canvas id="rainCanvas"></canvas>

    <!-- Screen 1: Loading (5 Sec) -->
    <div id="loading-screen" class="screen active">
        <h2 class="loading-text">Something is loading for Gungun......</h2>
    </div>

    <!-- Screen 2: Interactive Gift Box -->
    <div id="gift-screen" class="screen">
        <h2 class="instruction-text">Tap the Gift Box! 🎁</h2>
        <div id="giftBox" class="gift-box">
            <img src="gift.png" alt="Gift Box">
        </div>
    </div>

    <!-- Screen 3: Timer Screen -->
    <div id="timer-screen" class="screen">
        <h1 id="timer">11:59:50</h1>
    </div>

    <!-- Screen 4: Happy Birthday Wishes -->
    <div id="wish-screen" class="screen">
        <h1 class="hb-fade-text">Happy Birthday Gungun! 🎉✨</h1>
    </div>

    <!-- Screen 5: Template Image (Shows for 15s) -->
    <div id="template-screen" class="screen">
        <img src="birthday-template.png" alt="Birthday Template" class="template-img">
    </div>

    <!-- Screen 6: Letter Page -->
    <div id="letter-screen" class="screen">
        <div class="letter-container">
            <div id="typewriter" class="ruled-letter"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
